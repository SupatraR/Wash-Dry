<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ระบบฝากซัก อบ พับ</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 420px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #666;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #06c755;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            opacity: 0.9;
        }

        #userInfo {
            margin-top: 20px;
            text-align: left;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>ฝากซัก อบ พับ</h1>

    <p id="status">
        กรุณาเข้าสู่ระบบ
    </p>

    <button id="loginButton">
        เข้าสู่ระบบด้วย LINE
    </button>

    <div id="userInfo" class="hidden">
        <hr>

        <p>
            <strong>เข้าสู่ระบบแล้ว</strong>
        </p>

        <p>
            User ID:
            <br>
            <span id="userId"></span>
        </p>

        <p>
            ชื่อ:
            <br>
            <span id="userName"></span>
        </p>

        <button id="logoutButton">
            ออกจากระบบ
        </button>
    </div>

</div>

<script>

    // ========================================
    // Supabase Configuration
    // ========================================

    const SUPABASE_URL = 'https://YOUR_PROJECT_REF.supabase.co';

    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';


    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


    // ========================================
    // Login
    // ========================================

    document
        .getElementById('loginButton')
        .addEventListener('click', async () => {

            const { data, error } =
                await supabaseClient.auth.signInWithOAuth({
                    provider: 'custom:line',
                    options: {
                        redirectTo: window.location.origin
                    }
                });

            if (error) {
                console.error(error);

                alert(
                    'ไม่สามารถเข้าสู่ระบบได้\n' +
                    error.message
                );
            }
        });


    // ========================================
    // ตรวจสอบ Session
    // ========================================

    async function checkUser() {

        const {
            data: {
                session
            }
        } = await supabaseClient.auth.getSession();


        if (session) {

            const user = session.user;

            document
                .getElementById('status')
                .innerText = 'เข้าสู่ระบบเรียบร้อยแล้ว';

            document
                .getElementById('loginButton')
                .classList.add('hidden');

            document
                .getElementById('userInfo')
                .classList.remove('hidden');


            document
                .getElementById('userId')
                .innerText = user.id;


            document
                .getElementById('userName')
                .innerText =
                    user.user_metadata?.name ||
                    user.user_metadata?.display_name ||
                    '-';

        }
    }


    // ========================================
    // Logout
    // ========================================

    document
        .getElementById('logoutButton')
        .addEventListener('click', async () => {

            await supabaseClient.auth.signOut();

            window.location.reload();

        });


    // ========================================
    // Auth State Change
    // ========================================

    supabaseClient.auth.onAuthStateChange(
        (event, session) => {

            console.log(
                'Auth Event:',
                event,
                session
            );

            if (session) {
                checkUser();
            }

        }
    );


    // เริ่มตรวจสอบ
    checkUser();

</script>

</body>
</html>
